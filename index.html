<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c0c">
<title>BUILD.LOG</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0c0c0c;--surf:#161616;--surf2:#1e1e1e;--bd:#252525;--bd2:#2f2f2f;
--pro:#ff6b35;--carb:#3dd9c5;--fat:#f5c842;--run:#5b9cf6;--lift:#b06ef3;
--txt:#eee;--mut:#4a4a4a;--mut2:#787878;--ok:#4cce7a;--bad:#e05555;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif}
input,select,button,textarea{font-family:'DM Sans',sans-serif}
input:focus,select:focus{outline:none}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding-top:var(--st)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(76px + var(--sb))}
.bebas{font-family:'Bebas Neue',sans-serif}
.mono{font-family:'DM Mono',monospace}
header{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.95rem;letter-spacing:5px;color:var(--pro);line-height:1}
.logo-sub{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:2.5px;color:var(--mut2);margin-top:2px}
.dnav{display:flex;align-items:center;gap:7px;margin-top:3px}
.dnav button{background:none;border:1px solid var(--bd2);color:var(--mut2);width:30px;height:30px;border-radius:7px;font-size:1rem;display:flex;align-items:center;justify-content:center}
.dnav button:active{border-color:var(--pro);color:var(--pro)}
#dlbl{font-family:'DM Mono',monospace;font-size:.64rem;color:var(--mut2);text-align:center;min-width:76px;line-height:1.5}
#dlbl.today{color:var(--pro);font-weight:500}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#101010;border-top:1px solid var(--bd);display:flex;padding-bottom:var(--sb);z-index:200}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;background:none;border:none;color:var(--mut2);font-size:.56rem;font-weight:600;letter-spacing:.8px}
.nb .ic{font-size:1.15rem}
.nb.on{color:var(--pro)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:14px}
.cal{margin:14px 18px 0;padding:13px 16px;display:flex;align-items:center;gap:13px}
.cl{font-family:'DM Mono',monospace;font-size:.55rem;color:var(--mut2);letter-spacing:2px}
.cv{font-family:'Bebas Neue',sans-serif;font-size:2.3rem;line-height:1}
.cv.over{color:var(--bad)}.cv.close{color:var(--fat)}
.ceq{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--mut2);margin-top:2px;line-height:1.65}
.ceq .b{color:var(--run)}.ceq .n{color:var(--bad)}
.mb{flex:1;display:flex;flex-direction:column;gap:6px}
.mbr{display:flex;align-items:center;gap:5px}
.mbl{font-family:'DM Mono',monospace;font-size:.56rem;width:9px;text-align:right}
.mbg{flex:1;height:4px;background:var(--bd2);border-radius:2px;overflow:hidden}
.mbf{height:100%;border-radius:2px;width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}
.mbv{font-family:'DM Mono',monospace;font-size:.56rem;color:var(--mut2);width:27px;text-align:right}
.hero{margin:9px 18px 0;background:linear-gradient(135deg,#1c1108,#1a1208);border:1px solid #3a2215;border-radius:16px;padding:17px 20px 15px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,107,53,.13),transparent 65%);pointer-events:none}
.hl{font-family:'Bebas Neue',sans-serif;letter-spacing:5px;font-size:.7rem;color:var(--pro);opacity:.75}
.hn{display:flex;align-items:baseline;gap:5px}
.hc{font-family:'Bebas Neue',sans-serif;font-size:4.6rem;color:var(--pro);line-height:1}
.hs{color:#3a2215;font-size:1.7rem;font-weight:200}
.hg{font-family:'Bebas Neue',sans-serif;font-size:1.85rem;color:#5a3020}
.hu{font-size:.7rem;color:var(--mut2);margin-left:2px}
.hbg{margin-top:10px;height:5px;background:#2a1808;border-radius:3px;overflow:hidden}
.hbf{height:100%;background:linear-gradient(90deg,var(--pro),#ffaa80);border-radius:3px;width:0;transition:width .6s cubic-bezier(.4,0,.2,1)}
.hsub{margin-top:6px;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--mut2);display:flex;justify-content:space-between}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 18px 0}
.mc{padding:12px 13px 10px;position:relative;overflow:hidden}
.mca{position:absolute;bottom:0;left:0;right:0;height:2px}
.mcl{font-family:'Bebas Neue',sans-serif;font-size:.64rem;letter-spacing:3px;margin-bottom:2px}
.mcn{display:flex;align-items:baseline;gap:4px}
.mcv{font-family:'Bebas Neue',sans-serif;font-size:1.95rem;line-height:1}
.mcg{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--mut2)}
.mcb{margin-top:7px;height:3px;background:var(--bd2);border-radius:2px;overflow:hidden}
.mcf{height:100%;border-radius:2px;width:0;transition:width .6s cubic-bezier(.4,0,.2,1)}
.sec{margin:15px 18px 0}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.st{font-family:'Bebas Neue',sans-serif;font-size:.68rem;letter-spacing:4px;color:var(--mut2)}
.sb2{background:none;border:1px solid var(--bd2);border-radius:8px;padding:6px 11px;color:var(--mut2);font-size:.7rem}
.sb2:active{border-color:var(--pro);color:var(--pro)}
.shot{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.big{border:none;border-radius:13px;padding:15px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.78rem;font-weight:600;position:relative;overflow:hidden}
.big .bi{font-size:1.5rem;line-height:1}
.bph{background:linear-gradient(140deg,#ff6b35,#ff8f5e);color:#000}
.bph input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.btx{background:var(--surf);border:1px solid var(--bd2);color:var(--txt)}
.mealsel{width:100%;margin-top:9px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--mut2);font-size:.78rem;color-scheme:dark}
.tin{display:flex;gap:7px;margin-top:9px}
.tin input{flex:1;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;color:var(--txt);font-size:.85rem}
.tin input::placeholder{color:var(--mut)}
.tin input:focus{border-color:var(--pro)}
.tgo{background:var(--pro);border:none;border-radius:10px;padding:0 15px;color:#000;font-weight:700;font-size:.8rem}
.tgo:disabled{opacity:.4}
.prev{margin-top:10px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--bd2)}
.prev img{width:100%;max-height:200px;object-fit:cover;display:block}
.prevx{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:.85rem}
.busy{margin-top:11px;display:flex;align-items:center;gap:9px;color:var(--mut2);font-size:.78rem}
.spin{width:15px;height:15px;border:2px solid var(--bd2);border-top-color:var(--pro);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .22s ease}
.err{margin-top:10px;background:rgba(224,85,85,.08);border:1px solid rgba(224,85,85,.35);border-radius:11px;padding:11px 13px;font-size:.76rem;color:#ffb3b3;line-height:1.55}
.res{margin-top:11px}
.rh{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--mut2);letter-spacing:1.5px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.it{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.itop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.inm{font-size:.84rem;font-weight:600;line-height:1.3}
.ipo{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--mut2);margin-top:2px}
.cf{font-size:.5rem;padding:2px 6px;border-radius:8px;font-weight:700;letter-spacing:.5px;flex-shrink:0}
.cf.high{background:rgba(76,206,122,.15);color:var(--ok)}
.cf.medium{background:rgba(245,200,66,.15);color:var(--fat)}
.cf.low{background:rgba(224,85,85,.15);color:var(--bad)}
.imr{display:flex;background:var(--surf2);border-radius:9px;overflow:hidden;margin-top:9px}
.im{flex:1;text-align:center;padding:7px 2px;border-right:1px solid var(--bd)}
.im:last-child{border-right:none}
.imv{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;line-height:1}
.iml{font-family:'DM Mono',monospace;font-size:.48rem;color:var(--mut);letter-spacing:.8px}
.iact{display:flex;gap:6px;margin-top:9px;align-items:center}
.mult{display:flex;gap:4px;flex:1}
.mu{flex:1;background:none;border:1px solid var(--bd2);border-radius:7px;padding:6px 0;color:var(--mut2);font-size:.68rem;font-weight:600}
.mu.on{background:rgba(255,107,53,.14);border-color:var(--pro);color:var(--pro)}
.ied,.irm{background:none;border:1px solid var(--bd2);border-radius:7px;padding:6px 9px;color:var(--mut2);font-size:.7rem}
.irm:active{border-color:var(--bad);color:var(--bad)}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.edit label{font-family:'DM Mono',monospace;font-size:.55rem;color:var(--mut2);display:flex;align-items:center;gap:5px}
.edit input{flex:1;width:100%;background:var(--surf2);border:1px solid var(--bd2);border-radius:7px;padding:6px 8px;color:var(--txt);font-family:'DM Mono',monospace;font-size:.78rem;text-align:right}
.edit input[type=text]{text-align:left;font-family:'DM Sans',sans-serif;font-size:.8rem}
.edit input:focus{border-color:var(--pro)}
.addall{width:100%;background:var(--pro);border:none;border-radius:11px;padding:13px;color:#000;font-weight:700;font-size:.85rem;margin-top:2px}
.note{font-size:.66rem;color:var(--mut2);font-style:italic;line-height:1.5;margin:2px 0 9px}
.sres{background:var(--surf2);border:1px solid var(--bd2);border-radius:11px;margin-top:8px;overflow:hidden}
.sri{padding:10px 13px;border-bottom:1px solid var(--bd)}
.sri:last-child{border-bottom:none}
.sri:active{background:var(--surf)}
.srn{font-size:.82rem;font-weight:500}
.srm{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--mut2);margin-top:2px}
.wf{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:12px 13px;margin-bottom:9px;display:none}
.wf.on{display:block}
.wt{display:flex;gap:6px;margin-bottom:8px}
.wtb{flex:1;background:none;border:1px solid var(--bd2);border-radius:8px;padding:8px 3px;color:var(--mut2);font-size:.74rem}
.wtb.run{background:rgba(91,156,246,.15);border-color:var(--run);color:var(--run)}
.wtb.lift{background:rgba(176,110,243,.15);border-color:var(--lift);color:var(--lift)}
.wtb.other{background:rgba(61,217,197,.12);border-color:var(--carb);color:var(--carb)}
.wi{display:flex;gap:6px}
.wi input{background:var(--surf2);border:1px solid var(--bd2);border-radius:8px;padding:10px;color:var(--txt);font-size:.82rem;min-width:0}
.wi input:focus{border-color:var(--pro)}
.wadd{background:var(--pro);border:none;border-radius:8px;padding:10px 14px;color:#000;font-weight:700;font-size:.78rem;white-space:nowrap}
.favs{display:flex;flex-wrap:wrap;gap:7px}
.fav{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 13px;border-radius:12px;background:var(--surf);border:1px solid var(--bd2);color:var(--txt);font-family:'DM Sans',sans-serif;text-align:left;position:relative}
.fav:active{border-color:var(--pro);background:var(--surf2)}
.favn{font-size:.76rem;font-weight:600;line-height:1.2}
.favm{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--mut2);letter-spacing:.3px}
.favx{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--bad);border:none;color:#fff;font-size:.6rem;display:none;align-items:center;justify-content:center;padding:0}
.favs.editing .favx{display:flex}
.favedit{background:none;border:none;color:var(--mut2);font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:1px;padding:0}
.favedit.on{color:var(--pro)}
.dsel{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.dbtn{padding:11px 9px;border-radius:11px;background:var(--surf);border:1px solid var(--bd2);color:var(--mut);text-align:left;font-family:'DM Sans',sans-serif}
.dbtn.on{border-color:var(--pro);background:var(--surf2);color:var(--txt)}
.dbtn .dn{font-size:.78rem;font-weight:700;line-height:1.15}
.dbtn .dp{font-family:'DM Mono',monospace;font-size:.56rem;color:var(--mut2);margin-top:3px;letter-spacing:.4px}
.loc{display:flex;border:1px solid var(--bd2);border-radius:11px;overflow:hidden;margin-bottom:14px}
.loc button{flex:1;padding:11px;background:transparent;border:none;color:var(--mut2);font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:1.5px}
.loc button.on{background:var(--pro);color:#0a0a0a;font-weight:600}
.ex{display:flex;align-items:flex-start;gap:12px;padding:12px 13px;border-radius:11px;border:1px solid transparent;margin-bottom:5px}
.ex:active{background:var(--surf)}
.ex.done{opacity:.4}
.ex.done .exn{text-decoration:line-through}
.exck{flex-shrink:0;width:21px;height:21px;margin-top:1px}
.exn{font-size:.83rem;font-weight:600;line-height:1.3}
.exm{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--pro);letter-spacing:.5px;margin-top:2px}
.exc{font-size:.68rem;color:var(--mut2);font-style:italic;margin-top:3px;line-height:1.45}
.lbar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;margin:4px 0 14px}
.lfill{height:100%;background:var(--pro);border-radius:2px;transition:width .35s}
.lhead{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.lpct{font-size:1.7rem;font-weight:800;color:var(--pro);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;font-size:.75rem;font-weight:500}
.chip.run{background:rgba(91,156,246,.12);border:1px solid rgba(91,156,246,.3);color:var(--run)}
.chip.lift{background:rgba(176,110,243,.12);border:1px solid rgba(176,110,243,.3);color:var(--lift)}
.chip.other{background:rgba(61,217,197,.1);border:1px solid rgba(61,217,197,.25);color:var(--carb)}
.chipc{font-family:'DM Mono',monospace;font-size:.63rem;opacity:.75}
.chipx{background:none;border:none;color:inherit;opacity:.45;font-size:.78rem;padding:0 0 0 2px;line-height:1}
.mg{margin-bottom:14px}
.mgh{font-family:'Bebas Neue',sans-serif;font-size:.66rem;letter-spacing:4px;color:var(--mut2);border-bottom:1px solid var(--bd);padding-bottom:5px;margin-bottom:4px;display:flex;justify-content:space-between}
.mgp{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--pro);letter-spacing:0}
.fe{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #181818}
.fen{font-size:.8rem;font-weight:500;flex:1;padding-right:7px;line-height:1.3}
.fep{font-family:'DM Mono',monospace;font-size:.56rem;color:var(--mut);display:block;margin-top:1px}
.fem{display:flex;gap:7px;margin-right:7px;flex-shrink:0}
.fm{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--mut2)}
.fex{background:none;border:none;color:#333;font-size:.88rem;padding:4px;line-height:1;flex-shrink:0}
.empty{text-align:center;padding:26px 16px;color:var(--mut);font-size:.78rem;font-style:italic}
.hc2{margin:11px 18px 0;padding:13px 15px}
.hd{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--mut2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.hbd{display:flex;gap:4px;flex-wrap:wrap}
.hb{font-size:.54rem;padding:2px 6px;border-radius:9px;font-weight:600}
.hb.run{background:rgba(91,156,246,.15);color:var(--run)}
.hb.lift{background:rgba(176,110,243,.15);color:var(--lift)}
.hb.other{background:rgba(61,217,197,.12);color:var(--carb)}
.hm{display:flex;background:var(--surf2);border-radius:9px;overflow:hidden}
.hmi{flex:1;text-align:center;padding:8px 2px;border-right:1px solid var(--bd)}
.hmi:last-child{border-right:none}
.hmv{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;line-height:1}
.hml{font-family:'DM Mono',monospace;font-size:.48rem;color:var(--mut);letter-spacing:.8px}
.gp{margin:14px 18px 0;padding:18px}
.gt{font-family:'Bebas Neue',sans-serif;letter-spacing:4px;font-size:.74rem;color:var(--mut2);margin-bottom:14px}
.gr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.gr label{font-size:.82rem;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%}
.gr input{width:84px;background:var(--surf2);border:1px solid var(--bd2);border-radius:8px;padding:8px 10px;color:var(--txt);font-family:'DM Mono',monospace;font-size:.84rem;text-align:right}
.gr input:focus{border-color:var(--pro)}
.gsave{width:100%;margin-top:6px;background:var(--pro);border:none;border-radius:9px;padding:12px;color:#000;font-weight:700;font-size:.82rem}
.gn{margin-top:13px;padding-top:13px;border-top:1px solid var(--bd);font-size:.68rem;color:var(--mut2);line-height:1.6}
.util{display:flex;gap:8px;margin-top:11px}
.util button{flex:1;background:none;border:1px solid var(--bd2);border-radius:9px;padding:10px;color:var(--mut2);font-size:.74rem}
.diag{margin-top:11px;font-family:'DM Mono',monospace;font-size:.62rem;line-height:1.6;color:var(--mut2);word-break:break-word}
.toast{position:fixed;bottom:calc(80px + var(--sb));left:50%;transform:translateX(-50%) translateY(24px);background:#242424;border:1px solid var(--bd2);border-radius:10px;padding:10px 18px;font-size:.78rem;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:999;opacity:0;max-width:88%;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ═══════════ TRAINING & CALENDAR LOGIC ═══════════ */
let trainDate = new Date();
let tActivities = [];
let tReadiness = [];
let tPlanned = [];
let tFuelKits = [];
let tSelectedKit = null;
let tTargetLongRunDate = null;

async function initTrainTab(){
  if(!sb){
    document.getElementById('train-days-grid').innerHTML = 
      '<div style="grid-column:1/-1;text-align:center;padding:26px 10px;color:var(--mut2);font-size:.78rem">Configure <code>SUPABASE_URL</code> & <code>SUPABASE_ANON_KEY</code> in index.html to view Garmin telemetry.</div>';
    return;
  }
  await loadFuelKits();
  await loadTrainCalendar();
}

async function loadFuelKits(){
  const { data } = await sb.from('fuel_kits').select('*');
  if(data && data.length > 0){
    tFuelKits = data;
    if(!tSelectedKit) tSelectedKit = data[0];
  }
}

function renderKitsUI(){
  const g = document.getElementById('train-kits-grid');
  g.innerHTML = tFuelKits.map(k => `
    <div onclick="pickFuelKit('${k.id}')" class="tkit-btn ${tSelectedKit?.id === k.id ? 'on' : ''}">
      <div style="font-weight:700;font-size:.82rem;color:#fff">${esc(k.name)}</div>
      <div style="font-family:'DM Mono',monospace;font-size:.66rem;color:var(--run);margin-top:2px">${k.target_hourly_carbs}g carbs / hr</div>
      <div style="font-size:.64rem;color:var(--mut2);margin-top:3px">${esc(k.description || '')}</div>
    </div>
  `).join('');
  renderKitSummary();
}

function pickFuelKit(id){
  tSelectedKit = tFuelKits.find(k => k.id === id);
  renderKitsUI();
}

function renderKitSummary(){
  if(!tSelectedKit) return;
  const miles = Number(document.getElementById('train-miles').value) || 13.1;
  const estCarbs = Math.round(tSelectedKit.target_hourly_carbs * (miles / 7.5));
  const s = document.getElementById('train-kit-summary');
  s.style.display = 'block';
  s.innerHTML = `
    <div style="font-weight:700;color:var(--txt);border-bottom:1px solid var(--bd2);padding-bottom:5px;margin-bottom:6px;display:flex;justify-content:space-between">
      <span>RACE REHEARSAL PLAN (${tTargetLongRunDate || 'Weekend'})</span>
      <span style="color:var(--run)">~${estCarbs}g carbs total</span>
    </div>
    <div style="color:var(--mut2)">● <strong>Pre-Run:</strong> ${tSelectedKit.pre_run_items ? tSelectedKit.pre_run_items.map(i => `${i.item} (${i.timing})`).join(', ') : 'None'}</div>
    <div style="color:var(--mut2);margin-top:4px">● <strong>In-Run:</strong> ${tSelectedKit.in_run_items ? tSelectedKit.in_run_items.map(i => i.item).join(', ') : 'Water only'}</div>
    <div style="color:var(--mut2);margin-top:4px">● <strong>Hydration:</strong> ${tSelectedKit.hydration_setup?.flask_1 || 'Water'} + ${tSelectedKit.hydration_setup?.flask_2 || 'None'}</div>
  `;
}

// Automatically detect the upcoming weekend long run from planned_workouts
function detectUpcomingLongRun(){
  const today = new Date();
  const sat = new Date(today);
  sat.setDate(today.getDate() + ((6 - today.getDay() + 7) % 7 || 7));
  const sun = new Date(sat);
  sun.setDate(sat.getDate() + 1);

  const satStr = sat.toISOString().split('T')[0];
  const sunStr = sun.toISOString().split('T')[0];

  const plannedSun = tPlanned.find(p => p.date === sunStr);
  const plannedSat = tPlanned.find(p => p.date === satStr);

  // If Sunday has the long run, lock to Sunday; otherwise check Saturday
  if(plannedSun && plannedSun.distance_miles > (plannedSat?.distance_miles || 0)){
    tTargetLongRunDate = sunStr;
    document.getElementById('train-miles').value = plannedSun.distance_miles;
  } else if(plannedSat && plannedSat.distance_miles > 0){
    tTargetLongRunDate = satStr;
    document.getElementById('train-miles').value = plannedSat.distance_miles;
  } else {
    // Default to Sunday 13.1
    tTargetLongRunDate = sunStr;
    document.getElementById('train-miles').value = 13.1;
  }

  // Update button label with the exact day
  const dObj = new Date(tTargetLongRunDate + 'T12:00:00');
  const dayName = dObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const btn = document.getElementById('train-save-btn');
  if(btn) btn.textContent = `LOCK IN FUEL PLAN FOR ${dayName.toUpperCase()}`;
}

async function saveWeekendFuelPlan(){
  if(!sb || !tSelectedKit) return;
  const targetStr = tTargetLongRunDate;
  const miles = Number(document.getElementById('train-miles').value) || 13.1;
  const totalCarbs = Math.round(tSelectedKit.target_hourly_carbs * (miles / 7.5));

  await sb.from('daily_readiness').upsert({ date: targetStr });
  await sb.from('run_fueling_logs').upsert({
    date: targetStr,
    planned_kit_id: tSelectedKit.id,
    planned_carbs_total: totalCarbs
  });

  const btn = document.getElementById('train-save-btn');
  btn.textContent = '✓ SCHEDULED TO ' + targetStr;
  btn.style.background = 'var(--ok)';
  setTimeout(() => {
    detectUpcomingLongRun();
    btn.style.background = 'var(--run)';
  }, 3500);
  loadTrainCalendar();
}

async function loadTrainCalendar(){
  const y = trainDate.getFullYear();
  const m = trainDate.getMonth();
  const startStr = `${y}-${String(m + 1).padStart(2,'0')}-01`;
  const lastDay = new Date(y, m + 1, 0).getDate();
  const endStr = `${y}-${String(m + 1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;

  document.getElementById('train-month-title').textContent = trainDate.toLocaleString('default', { month: 'long', year: 'numeric' });

  const { data: act } = await sb.from('activities').select('*').gte('date', startStr).lte('date', endStr);
  const { data: read } = await sb.from('daily_readiness').select('*').gte('date', startStr).lte('date', endStr);
  const { data: plan } = await sb.from('planned_workouts').select('*').gte('date', startStr).lte('date', endStr);

  tActivities = act || [];
  tReadiness = read || [];
  tPlanned = plan || [];

  detectUpcomingLongRun();
  renderKitsUI();
  renderTrainGrid();
}

function shiftTrainMonth(dir){
  trainDate.setMonth(trainDate.getMonth() + dir);
  loadTrainCalendar();
}

function renderTrainGrid(){
  const g = document.getElementById('train-days-grid');
  g.innerHTML = '';
  const y = trainDate.getFullYear();
  const m = trainDate.getMonth();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const firstDay = new Date(y, m, 1).getDay();

  for(let i=0; i<firstDay; i++){
    g.innerHTML += '<div class="cday-empty"></div>';
  }

  for(let day=1; day<=daysInMonth; day++){
    const dStr = `${y}-${String(m + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const act = tActivities.find(a => a.date === dStr);
    const read = tReadiness.find(r => r.date === dStr);
    const plan = tPlanned.find(p => p.date === dStr);

    let dot = '';
    if(read?.hrv_status === 'BALANCED') dot = '<span style="width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block"></span>';
    if(read?.hrv_status === 'UNBALANCED') dot = '<span style="width:6px;height:6px;border-radius:50%;background:var(--fat);display:inline-block"></span>';
    if(read?.hrv_status === 'LOW') dot = '<span style="width:6px;height:6px;border-radius:50%;background:var(--bad);display:inline-block"></span>';

    let badge = '<div style="font-family:\'DM Mono\',monospace;font-size:.54rem;color:var(--mut)">Rest</div>';

    // 1. Completed Garmin Activity (Solid Green/Blue)
    if(act){
      const pMin = Math.floor(act.avg_pace_sec / 60);
      const pSec = String(act.avg_pace_sec % 60).padStart(2,'0');
      badge = `
        <div class="tbadge">
          <div style="font-weight:800;font-size:.66rem;color:var(--run)">${act.distance_miles} mi</div>
          <div style="font-family:'DM Mono',monospace;font-size:.52rem;color:var(--mut2)">${pMin}:${pSec}/mi</div>
        </div>
      `;
    } 
    // 2. Future Planned Workout (Dashed Outline)
    else if(plan && plan.distance_miles > 0){
      badge = `
        <div style="border:1px dashed var(--run);background:rgba(91,156,246,0.08);border-radius:5px;padding:2px 4px;text-align:left">
          <div style="font-weight:700;font-size:.62rem;color:var(--run)">${plan.distance_miles} mi</div>
          <div style="font-family:'DM Mono',monospace;font-size:.50rem;color:var(--mut2)">Plan</div>
        </div>
      `;
    }

    g.innerHTML += `
      <div class="cday" onclick="openTrainModal('${dStr}')">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-family:'DM Mono',monospace;font-size:.62rem;font-weight:700;color:var(--txt)">${day}</span>
          ${dot}
        </div>
        ${badge}
      </div>
    `;
  }
}

async function openTrainModal(dStr){
  const act = tActivities.find(a => a.date === dStr);
  const read = tReadiness.find(r => r.date === dStr);
  const plan = tPlanned.find(p => p.date === dStr);
  const { data: fuel } = await sb.from('run_fueling_logs').select('*').eq('date', dStr).maybeSingle();

  document.getElementById('tmodal-date').textContent = dStr;

  // Workout / Planned Section
  const aSec = document.getElementById('tmodal-act-sec');
  if(act){
    const pMin = Math.floor(act.avg_pace_sec / 60);
    const pSec = String(act.avg_pace_sec % 60).padStart(2,'0');
    aSec.innerHTML = `
      <div style="background:var(--surf2);border:1px solid var(--bd2);border-radius:12px;padding:12px">
        <div style="font-size:.8rem;font-weight:700;color:var(--run);margin-bottom:8px">${esc(act.name || 'Run')} <span style="font-size:.6rem;color:var(--ok)">✓ Completed</span></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px">
          <div><div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#fff">${act.distance_miles} mi</div><div style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--mut2)">${pMin}:${pSec}/mi</div></div>
          <div><div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#fff">${act.avg_power || '—'} W</div><div style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--mut2)">Avg Power</div></div>
          <div><div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#fff">${act.avg_hr || '—'} bpm</div><div style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--mut2)">Max ${act.max_hr || '—'}</div></div>
        </div>
        <div style="border-top:1px solid var(--bd2);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--txt)">
          <span>Cadence: <strong>${act.avg_cadence || '—'} spm</strong></span>
          <span>GCT: <strong>${act.avg_gct || '—'} ms</strong></span>
          <span>Burn: <strong>${act.active_calories || '—'} kcal</strong></span>
        </div>
      </div>
    `;
  } else if(plan){
    aSec.innerHTML = `
      <div style="background:var(--surf2);border:1px dashed var(--run);border-radius:12px;padding:12px">
        <div style="font-size:.8rem;font-weight:700;color:var(--run);margin-bottom:4px">${esc(plan.name)} <span style="font-size:.6rem;color:var(--mut2)">★ Planned</span></div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:#fff">${plan.distance_miles} mi ${plan.target_pace ? '@ ' + plan.target_pace : ''}</div>
        <div style="font-size:.68rem;color:var(--mut2);margin-top:4px">${esc(plan.description || '')}</div>
      </div>
    `;
  } else {
    aSec.innerHTML = '<div style="font-size:.72rem;color:var(--mut2);font-style:italic">No workout or planned run on this date.</div>';
  }

  // Recovery & Biometrics
  const rSec = document.getElementById('tmodal-read-sec');
  const sleepH = read?.sleep_duration_sec ? Math.floor(read.sleep_duration_sec / 3600) : 0;
  const sleepM = read?.sleep_duration_sec ? Math.floor((read.sleep_duration_sec % 3600) / 60) : 0;
  rSec.innerHTML = `
    <div style="background:var(--surf2);border:1px solid var(--bd2);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <span style="font-size:.66rem;color:var(--mut2)">Overnight HRV:</span>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#fff;margin-top:2px">${read?.hrv_last_night ? read.hrv_last_night + ' ms' : 'N/A'}</div>
        <div style="font-family:'DM Mono',monospace;font-size:.56rem;color:var(--mut2)">Status: ${read?.hrv_status || 'N/A'} (Base: ${read?.hrv_baseline || '—'} ms)</div>
      </div>
      <div>
        <span style="font-size:.66rem;color:var(--mut2)">Sleep Quality:</span>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#fff;margin-top:2px">${read?.sleep_score ? read.sleep_score + ' / 100' : 'N/A'}</div>
        <div style="font-family:'DM Mono',monospace;font-size:.56rem;color:var(--mut2)">Duration: ${sleepH}h ${sleepM}m</div>
      </div>
    </div>
  `;

  // Fueling Execution
  const fSec = document.getElementById('tmodal-fuel-sec');
  fSec.innerHTML = `
    <div style="background:var(--surf2);border:1px solid var(--bd2);border-radius:12px;padding:12px;font-size:.72rem">
      <div style="display:flex;justify-content:space-between;color:var(--txt)">
        <span>Planned Fuel Target:</span>
        <strong style="color:var(--run)">${fuel?.planned_carbs_total ? fuel.planned_carbs_total + 'g carbs' : 'Not set'}</strong>
      </div>
      <div style="display:flex;justify-content:space-between;color:var(--mut2);margin-top:4px">
        <span>Actual Intake Logged:</span>
        <span>${fuel?.actual_carbs_consumed ? fuel.actual_carbs_consumed + 'g' : 'Pending post-run'}</span>
      </div>
    </div>
  `;

  document.getElementById('tmodal-wrap').style.display = 'flex';
}

function closeTrainModal(){
  document.getElementById('tmodal-wrap').style.display = 'none';
}

/* ═══════════ UTIL ═══════════ */
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let tt;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
document.getElementById('mealSel').addEventListener('change',()=>{if(pending)renderItems()});

/* ═══════════ INIT ═══════════ */
load();
document.getElementById('mealSel').value=defaultMeal();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
